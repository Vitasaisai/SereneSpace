
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diary | SereneSpace</title>

    <link rel="stylesheet" href="./diary.css">
</head>

<body class="gradient-background">

    <!-- HEADER -->
    <header class="site-header">

        <nav id="main-menu">

            <!-- Logo -->
            <a id="logo" href="index.html">
                <img src="./SereneSpace-logo.png" alt="SereneSpace Logo">
            </a>

            <!-- Navigation -->
            <div class="nav-links">
                <a id="diary-button" href="diary.html">Diary</a>
                <a id="taskmaster-button" href="test.html">Taskmaster</a>
                <a id="musicplayer-button" href="serenespace_musicplayer2.html">Music Player</a>
            </div>

            <!-- Sign In -->
            <a id="log-in-button" href="serenespace_login.html">
                Sign In
            </a>

        </nav>

    </header>


    <!-- MAIN CONTENT -->
    <main class="page-background">

        <section class="notepad">

            <!-- LEFT: SAVED ENTRIES -->
            <aside class="saved-panel">

                <h2>Saved Entries (134)</h2>

                <ul>
                    <li>Homework to do: page...</li>
                    <li>Comfort spongecake recipe...</li>
                    <li>Dear diary, today I...</li>
                </ul>

            </aside>


            <!-- RIGHT: DIARY EDITOR -->
            <section class="editor">

                <!-- Toolbar -->
                <div class="toolbar">

                    <div class="tools">
                        <button type="button">Aa</button>
                        <button type="button">☷</button>
                        <button type="button">✎</button>
                        <button type="button">Invisible Ink</button>
                    </div>

                    <div class="search">
                        <input type="text" placeholder="Search">
                    </div>

                </div>


                <!-- Writing Area -->
                <div class="writing-area">

                    <p class="placeholder">
                        Type your thoughts...
                    </p>

                    <textarea placeholder="Dear diary,"></textarea>

                </div>


                <!-- Action Buttons -->
                <div class="actions">

                    <button type="button" class="save-button">
                        ♧ Save entry
                    </button>

                    <button type="button" class="release-button">
                        ☁ Let it go
                    </button>

                </div>

            </section>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">

        <nav class="footer-menu">

            <div class="footer-contact">
                <h3>
                    <strong>Write us:</strong>
                    support.serenespace@gmail.com
                </h3>

                <span class="star-divider">✮</span>

                <h3>
                    <strong>Number:</strong>
                    +441234567890
                </h3>
            </div>

            <div class="footer-date">
                <h3>Saturday, October 31</h3>
                <span class="star-divider">✮</span>
                <h3 class="footer-time">00:29</h3>
            </div>

        </nav>

    </footer>

</body>
</html>
